name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build & Package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        run: |
          npm ci
          npm run build
        working-directory: frontend

      - name: Assemble release package
        run: |
          mkdir -p release/PaperSummar
          cp -r backend release/PaperSummar/
          cp -r frontend/dist release/PaperSummar/frontend/
          cp -r scripts release/PaperSummar/
          cp pyproject.toml start.bat start.ps1 start.sh README.md LICENSE release/PaperSummar/
          cd release
          zip -r PaperSummar-${{ github.ref_name }}.zip PaperSummar

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/PaperSummar-*.zip
          generate_release_notes: true
